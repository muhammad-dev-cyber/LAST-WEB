
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawora - Contact</title>
<style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #fffaf4;
    color: #333;
}

/* Navbar */
header {
    background-color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #e58b50;
    font-size: 25px;
    font-weight: bold;
}

nav a {
    text-decoration: none;
    color: #333;
    margin: 10px;
}

nav a:hover {
    color: #e58b50;
}

/* Hero */
.hero {
    background-color: #ffead8;
    padding: 60px 30px;
    display: flex;
    align-items: center;
    justify-content: space-around;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

.hero p {
    margin-bottom: 20px;
}

.hero img {
    width: 40%;
    border-radius: 10px;
}

/* Button */
.btn {
    background-color: #e58b50;
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 5px;
    display: inline-block;
}

/* Sections */
section {
    padding: 50px 8%;
}

.section-title {
    text-align: center;
    margin-bottom: 20px;
}

.subtitle {
    text-align: center;
    margin-bottom: 30px;
}

/* Service Cards */
.services {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    background-color: white;
    padding: 20px;
    width: 280px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ddd;
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 8px;
}

.card h3 {
    margin: 15px 0;
    color: #e58b50;
}

/* About */
.about {
    display: flex;
    align-items: center;
    gap: 30px;
    background-color: #ffead8;
}

.about img {
    width: 40%;
    border-radius: 10px;
}

.about-text h2 {
    margin-bottom: 15px;
}

/* Contact */
.contact-form {
    max-width: 500px;
    margin: auto;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

textarea {
    height: 120px;
}

button {
    cursor: pointer;
}

/* Footer */
footer {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 20px;
}

/* Mobile */
@media (max-width: 768px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    .hero, .about {
        flex-direction: column;
        text-align: center;
    }

    .hero img, .about img {
        width: 100%;
    }

    .hero h1 {
        font-size: 30px;
    }

    .services {
        flex-direction: column;
        align-items: center;
    }
}</style>
</head>
<body>

<header>
    <div class="logo">🐾 Pawora</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>

<section class="contact">
    <h1 class="section-title">Contact Us 📩</h1>
    <p class="subtitle">
    Have questions? We would love to hear from you!
    </p>

    <div class="contact-form">
        <form>

            <input type="text"
            placeholder="Your Name" required>

            <input type="email"
            placeholder="Your Email" required>

            <input type="text"
            placeholder="Your Pet Name">

            <input type="text"
            placeholder="Subject" required>

            <textarea
            placeholder="Write Your Message..."
            required></textarea>

            <button type="submit" class="btn">
            Send Message
            </button>

        </form>
    </div>
</section>

<footer>
    <p>🐾 Pawora | Made With Love For Pet Lovers</p>
    <p>© 2026 Pawora. All Rights Reserved.</p>
</footer>

</body>
</html>
